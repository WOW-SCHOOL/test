<style>
:root{

.wordmark{display:flex;align-items:center;gap:22px}.logo3d{display:flex;align-items:center;gap:14px}.wowmark{position:relative;width:150px;height:72px;border-radius:26px;background:linear-gradient(145deg,#2168d2,#36b7f3);box-shadow:inset 0 3px 0 rgba(255,255,255,.32),inset 0 -10px 24px rgba(14,83,172,.16),0 16px 28px rgba(34,103,198,.22);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:1000;font-size:42px;letter-spacing:-3px}.wowmark:after{content:"";position:absolute;width:38px;height:15px;border-bottom:5px solid #4cf0e5;border-radius:0 0 50% 50%;bottom:9px;left:56px;transform:rotate(-3deg)}
.brandline{width:2px;height:66px;background:linear-gradient(transparent,#94acd1,transparent)}.brandtext strong{display:block;font-size:34px;letter-spacing:.03em;color:#092455}.brandtext span{display:block;margin-top:5px;font-size:15px;color:#68789a;font-weight:650}

.mainpanel{position:absolute;left:70px;right:70px;top:145px;bottom:58px;border-radius:38px;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.84));border:1px solid rgba(255,255,255,.96);box-shadow:0 30px 70px rgba(45,75,145,.18),inset 0 2px 0 rgba(255,255,255,.98);overflow:hidden}.mainpanel:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(60,151,255,.08),transparent 28%,transparent 72%,rgba(151,92,255,.07));pointer-events:none}
.content{position:relative;height:100%;padding:34px 42px 28px;display:flex;flex-direction:column}
.titlebar{height:84px;display:flex;justify-content:space-between;align-items:flex-start;gap:28px;flex:0 0 auto}.titlewrap h1{font-size:46px;line-height:1;letter-spacing:-1.9px;margin:0;color:#10275e}.titlewrap h1 .n{color:#2c8cf2}.titlewrap p{margin:10px 0 0;font-size:19px;font-weight:700;color:#687aa1}.progress{width:260px;padding:14px 18px;border-radius:23px;background:rgba(255,255,255,.87);box-shadow:0 12px 24px rgba(55,78,129,.11),inset 0 1px 0 #fff;border:1px solid #edf3fb}.progress strong{font-size:18px}.track{height:11px;border-radius:999px;background:#e6edf7;margin-top:10px;overflow:hidden}.track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#23c7bf,#2c8ef5)}
.grid{display:grid;gap:12px 16px;flex:1;min-height:0;margin-top:8px}.grid.two{grid-template-columns:1fr 1fr}.task{position:relative;border-radius:20px;background:#fff;border:1px solid #e6edf8;box-shadow:0 9px 22px rgba(43,70,122,.075),inset 0 1px 0 #fff;padding:8px 13px;min-height:0;overflow:hidden}.task.correct{border-color:#80ddb0;background:#f0fff6}.task.wrong{border-color:#f3a0ad;background:#fff6f7}.qline{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px}.qtext{font-size:16px;line-height:1.12;font-weight:900;color:#1a326c;white-space:normal}.qnum{flex:none;width:24px;height:24px;border-radius:9px;background:#eaf4ff;color:#1874dc;display:grid;place-items:center;font-size:14px;font-weight:950}.answers{display:flex;gap:6px;flex-wrap:nowrap;margin-top:6px}.choice{height:34px;padding:0 12px;border-radius:12px;border:1px solid #d8e4f6;background:linear-gradient(180deg,#f9fbff,#f1f6ff);color:#183267;font-size:15px;font-weight:900;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 white;transition:.13s}.choice:hover{transform:translateY(-1px);border-color:#7ab5ff}.choice.sel{border-color:#4e9df6;background:#eaf5ff}.choice.good{border-color:#51cf8b;background:#eafff1;color:#15884a}.choice.bad{border-color:#ee8393;background:#fff0f2;color:#bd4053}.choice:disabled{cursor:default}.feedback{position:absolute;right:10px;top:7px;font-size:11px;font-weight:900}.feedback.good{color:#188c4e}.feedback.bad{color:#bf4053}
.selectrow{display:grid;grid-template-columns:1fr 1fr;gap:16px}.phrase-card{height:101px}.phrase{font-size:19px;font-weight:950;color:#17336d;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.phrase-select{height:40px;width:100%;border-radius:14px;border:1px solid #d9e5f5;background:#f7faff;color:#163065;padding:0 12px;font-size:15px;font-weight:800;outline:none}.phrase-select:focus{border-color:#48a0ff;box-shadow:0 0 0 3px rgba(42,144,246,.12)}
.footeractions{height:62px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto}.leftactions{display:flex;align-items:center;gap:12px}.audio{height:52px;border-radius:18px;padding:0 22px;background:linear-gradient(145deg,#22c7c0,#288df3);color:#fff;font-size:18px;font-weight:950;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 11px 23px rgba(30,145,205,.2)}.audio:hover{transform:translateY(-1px)}.audio.missing{background:linear-gradient(145deg,#aab6ca,#8c9ab1);cursor:not-allowed;box-shadow:none}.audioStatus{font-size:13px;color:#6a7a9c;font-weight:750;max-width:310px}.next{height:56px;min-width:180px;padding:0 28px;border-radius:19px;background:linear-gradient(145deg,#22c8c0,#258dec);color:white;font-size:21px;font-weight:950;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.24),0 12px 26px rgba(36,145,214,.20)}
.hero{height:100%;display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:center}.hero h1{font-size:88px;line-height:.92;letter-spacing:-5px;margin:0;color:#0e1f62}.hero h1 span{color:#278cf4}.hero p{font-size:23px;line-height:1.4;color:#56698f;font-weight:720;margin:22px 0 0;max-width:760px}.heroKicker{font-size:16px;font-weight:950;text-transform:uppercase;letter-spacing:.13em;color:#2889ec;margin-bottom:12px}.heroBtns{display:flex;gap:12px;margin-top:28px}.btn{height:58px;border-radius:19px;padding:0 28px;font-weight:950;font-size:19px;cursor:pointer}.primary{background:linear-gradient(145deg,#20c8c1,#288df3);color:white;box-shadow:0 13px 28px rgba(36,143,212,.22),inset 0 2px 0 rgba(255,255,255,.22)}.secondary{background:#fff;color:#18346d;border:1px solid #dce7f7}.visual{position:relative;height:500px;display:grid;place-items:center}.blob{width:390px;height:390px;border-radius:44% 56% 58% 42% / 48% 42% 58% 52%;background:linear-gradient(145deg,#44c8ff,#715cff 53%,#ff71aa);box-shadow:inset 14px 14px 32px rgba(255,255,255,.28),inset -18px -18px 38px rgba(38,39,123,.18),0 36px 58px rgba(53,82,170,.25);position:relative}.saucer{position:absolute;left:19%;right:19%;bottom:23%;height:48px;border-radius:50%;background:linear-gradient(#fff,#dce7f2);box-shadow:0 17px 25px rgba(30,57,104,.22)}.cup{position:absolute;left:27%;right:27%;top:31%;height:160px;border-radius:30px 30px 55px 55px;background:linear-gradient(145deg,#fff,#dce8f3);box-shadow:inset 10px 10px 18px #fff,inset -10px -10px 20px rgba(101,121,155,.17),0 24px 30px rgba(31,54,98,.23)}.cup:before{content:"";position:absolute;left:12%;right:12%;top:10%;height:37px;border-radius:50%;background:radial-gradient(ellipse,#cf915a 0 27%,#744525 29% 57%,#2c1b13 59%)}.cup:after{content:"";position:absolute;right:-56px;top:42px;width:62px;height:78px;border:14px solid #e7eef5;border-left:0;border-radius:0 34px 34px 0}.tag{position:absolute;padding:11px 16px;background:rgba(255,255,255,.9);border-radius:17px;box-shadow:0 12px 26px rgba(48,72,129,.18);font-weight:950}.tag.a{left:14px;top:46px;transform:rotate(-7deg)}.tag.b{right:12px;bottom:52px;transform:rotate(7deg)}
.sortarea{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;height:330px;margin-top:12px}.bin{border-radius:24px;border:2px dashed #a8c5ee;background:linear-gradient(180deg,#f8fbff,#eef5ff);padding:18px}.bin strong{font-size:34px;display:block;margin-bottom:10px}.binwords{display:flex;gap:8px;flex-wrap:wrap}.wordbank{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.word{height:46px;padding:0 18px;border-radius:15px;background:#fff;border:1px solid #dbe6f5;font-size:18px;font-weight:950;color:#142f68;cursor:pointer}.word.sel{outline:3px solid rgba(41,143,243,.24);border-color:#54a3f7}.word.good{background:#eafff1;border-color:#63d397}.word.bad{background:#fff0f2;border-color:#f08a99}
.results{display:grid;grid-template-columns:430px 1fr;gap:40px;align-items:center;flex:1}.ring{width:360px;height:360px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#28c77b calc(var(--pct)*1%),#e8eef8 0);position:relative;box-shadow:0 24px 46px rgba(41,91,148,.13)}.ring:after{content:"";position:absolute;width:286px;height:286px;border-radius:50%;background:linear-gradient(145deg,#fff,#f5f9ff);box-shadow:inset 0 4px 16px rgba(65,93,142,.08)}.ring strong{z-index:2;font-size:78px;letter-spacing:-4px}.ring span{position:absolute;z-index:2;margin-top:105px;color:#65769d;font-weight:850;font-size:18px}.resultlist{display:grid;gap:15px}.resrow{display:grid;grid-template-columns:220px 1fr 72px;gap:16px;align-items:center}.resrow label{font-size:19px;font-weight:900}.resbar{height:14px;border-radius:999px;background:#e8eef8;overflow:hidden}.resbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#2db7ff,#7959f7)}.resrow b{text-align:right;font-size:18px}.coach{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.coach>div{border-radius:20px;background:#fff;border:1px solid #e3ebf7;padding:17px 18px}.coach strong{display:block;font-size:17px;margin-bottom:7px}.coach p{font-size:15px;line-height:1.35;color:#65759a;font-weight:700;margin:0}
.smallnote{font-size:13px;color:#7080a0;font-weight:750}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="fit"><div id="app" class="app"></div></div>
<script>
const BASE_W=1600, BASE_H=900;
function fit(){const s=Math.min(innerWidth/BASE_W,innerHeight/BASE_H);document.getElementById('fit').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

const AUDIO={phrases:'assets/audio/phrases_1.mp3',numbers:'assets/audio/numbers_1.mp3',days:'assets/audio/days_1.mp3',pron:'assets/audio/pronunciation_1.mp3',listen1:'assets/audio/listening_1.mp3',listen2:'assets/audio/listening_2.mp3'};
const data={
 phrases:[['Hi','Привет'],['Hello','Здравствуйте / Привет'],['What’s your name?','Как тебя / вас зовут?'],['Nice to meet you','Приятно познакомиться'],['A cappuccino, please','Капучино, пожалуйста'],['A tea, please','Чай, пожалуйста'],['Thanks','Спасибо'],['Sorry','Извините / Простите']],
 grammar:[
  {q:'I ___ Helen',o:['am','are'],a:'am'},{q:'You ___ Tom',o:['am','are'],a:'are'},
  {q:'I ___ not Ellen',o:['am','are'],a:'am'},{q:'You ___ not Dom',o:['am','are'],a:'are'},
  {q:'___ I in class 2?',o:['Am','Are'],a:'Am'},{q:'___ you Mike?',o:['Am','Are'],a:'Are'},
  {q:'Are you Helen?',o:['Yes, I am','Yes, you are'],a:'Yes, I am'},{q:'Am I in your class?',o:['Yes, you are','Yes, I am'],a:'Yes, you are'},
  {q:'Are you Diana?',o:['No, I’m not','No, you aren’t'],a:'No, I’m not'},{q:'Am I in room 8?',o:['No, you aren’t','No, I’m not'],a:'No, you aren’t'}],
 numbers:[{q:'zero',o:['0','2','10'],a:'0'},{q:'three',o:['3','7','9'],a:'3'},{q:'five',o:['4','5','6'],a:'5'},{q:'seven',o:['1','7','8'],a:'7'},{q:'nine',o:['6','8','9'],a:'9'},{q:'one, two, ___',o:['three','five','ten'],a:'three'},{q:'seven, eight, ___',o:['nine','six','zero'],a:'nine'},{q:'eight, nine, ___',o:['ten','three','five'],a:'ten'}],
 days:[{q:'Monday →',o:['Tuesday','Friday','Sunday'],a:'Tuesday'},{q:'Tuesday →',o:['Wednesday','Monday','Saturday'],a:'Wednesday'},{q:'Wednesday →',o:['Thursday','Tuesday','Friday'],a:'Thursday'},{q:'Thursday →',o:['Friday','Sunday','Monday'],a:'Friday'},{q:'Friday →',o:['Saturday','Thursday','Tuesday'],a:'Saturday'},{q:'Saturday →',o:['Sunday','Friday','Monday'],a:'Sunday'},{q:'Goodbye, Tom. See you on ___',o:['Friday','five','tea'],a:'Friday'},{q:'See you ___',o:['tomorrow','cappuccino','Helen'],a:'tomorrow'}],
 pron:[{w:'hello',a:'/h/'},{w:'Helen',a:'/h/'},{w:'hi',a:'/h/'},{w:'I’m',a:'/aɪ/'},{w:'five',a:'/aɪ/'},{w:'nine',a:'/aɪ/'},{w:'meet',a:'/iː/'},{w:'tea',a:'/iː/'}],
 listening:[{q:'What does the speaker order?',o:['A cappuccino','A tea','Two teas'],a:'A cappuccino'},{q:'What name do you hear?',o:['Helen','Ellen','Diana'],a:'Helen'},{q:'Are you Diana?',o:['No, I’m not','Yes, you are','No, you aren’t'],a:'No, I’m not'},{q:'What does Tom order?',o:['A tea','A cappuccino','Three teas'],a:'A tea'},{q:'Tom or Dom?',o:['Tom','Dom','Mike'],a:'Tom'},{q:'What phrase do you hear?',o:['Nice to meet you','See you tomorrow','Good morning'],a:'Nice to meet you'},{q:'Which number do you hear?',o:['three','five','nine'],a:'five'},{q:'Which goodbye phrase do you hear?',o:['See you on Friday','See you on Monday','See you on Sunday'],a:'See you on Friday'}]
};
const MAX={phrases:8,grammar:10,numbers:8,days:8,pron:8,listening:8};
let state={screen:0,answers:{phrases:{},grammar:{},numbers:{},days:{},pron:{},listening:{}}};
try{const s=JSON.parse(localStorage.getItem('wow1a_v4'));if(s&&s.answers)state=s}catch(e){}
const app=document.getElementById('app');
function save(){localStorage.setItem('wow1a_v4',JSON.stringify(state))}
function score(sec){return Object.values(state.answers[sec]||{}).filter(Boolean).length}
function totalScore(){return Object.keys(MAX).reduce((n,k)=>n+score(k),0)}
function totalMax(){return Object.values(MAX).reduce((a,b)=>a+b,0)}
function header(){return `<div class="noise"></div><div class="header"><div class="wordmark"><div class="logo3d"><div class="wowmark">WOW</div><div class="brandline"></div><div class="brandtext"><strong>SCHOOL</strong><span>More English · Brighter Futures</span></div></div></div><div class="unitbadge"><span>English File Beginner</span><strong>Unit 1A</strong></div></div>`}
function panel(inner){return `${header()}<div class="mainpanel"><div class="content">${inner}</div></div>`}
function prog(n){return `<div class="progress"><strong>Прогресс ${n}/6</strong><div class="track"><i style="width:${n/6*100}%"></i></div></div>`}
function title(n,t,sub){return `<div class="titlebar"><div class="titlewrap"><h1><span class="n">${n}.</span> ${t}</h1><p>${sub}</p></div>${prog(n)}</div>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(sec,i,value,correct){if(state.answers[sec][i]!==undefined)return;state.answers[sec][i]=value===correct;save();render()}
function optionButtons(sec,i,q){return `<div class="answers">${q.o.map(o=>{const done=state.answers[sec][i]!==undefined;const chosen=window._selected?.[sec]?.[i]===o;let cls='choice';if(done){if(o===q.a)cls+=' good';else if(chosen)cls+=' bad'}return `<button class="${cls}" data-sec="${sec}" data-i="${i}" data-v="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`}).join('')}</div>`}
function taskGrid(sec,items){return `<div class="grid two" style="grid-template-rows:repeat(${Math.ceil(items.length/2)},1fr)">${items.map((q,i)=>{const done=state.answers[sec][i]!==undefined;return `<div class="task ${done?(state.answers[sec][i]?'correct':'wrong'):''}"><div class="qline"><div class="qtext">${esc(q.q)}</div><span class="qnum">${i+1}</span></div>${optionButtons(sec,i,q)}${done?`<div class="feedback ${state.answers[sec][i]?'good':'bad'}">${state.answers[sec][i]?'Верно':'Проверь ещё раз'}</div>`:''}</div>`}).join('')}</div>`}
window._selected={grammar:{},numbers:{},days:{},listening:{}};
function bindChoices(sec,items){document.querySelectorAll(`[data-sec="${sec}"]`).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;window._selected[sec][i]=b.dataset.v;choose(sec,i,b.dataset.v,items[i].a)})}
async function audioExists(src){try{const r=await fetch(src,{method:'HEAD',cache:'no-store'});return r.ok}catch(e){return false}}
function audioCtl(key,label,id){return `<button class="audio" data-audio="${key}" data-status="${id}">▶ ${label}</button><span class="audioStatus" id="${id}">Проверка MP3…</span>`}
async function bindAudio(){for(const b of document.querySelectorAll('[data-audio]')){const key=b.dataset.audio,src=AUDIO[key],st=document.getElementById(b.dataset.status);const ok=await audioExists(src);if(!ok){b.classList.add('missing');b.disabled=true;st.textContent='Нужен реальный британский MP3';continue}st.textContent='British English · MP3';b.onclick=async()=>{try{st.textContent='Воспроизведение…';const a=new Audio(src+'?v=4');await a.play();a.onended=()=>st.textContent='Готово к повтору'}catch(e){st.textContent='Не удалось воспроизвести MP3'}}}}
function nav(next,label='Далее →'){return `<button class="next" id="next">${label}</button>`}
function setScreen(n){state.screen=n;save();render()}
function start(){app.innerHTML=panel(`<div class="hero"><div><div class="heroKicker">Unit Review · Lesson 1A</div><h1>A cappuccino,<span>please</span></h1><p>Проверочная работа только по материалу Lesson 1A: фразы, verb be с I / you, numbers 0–10, days of the week, pronunciation и listening.</p><div class="heroBtns"><button class="btn primary" id="start">Начать →</button><button class="btn secondary" id="reset">Сбросить прогресс</button></div></div><div class="visual"><div class="blob"><div class="saucer"></div><div class="cup"></div><div class="tag a">6 блоков</div><div class="tag b">British MP3</div></div></div></div>`);document.getElementById('start').onclick=()=>setScreen(1);document.getElementById('reset').onclick=()=>{state={screen:0,answers:{phrases:{},grammar:{},numbers:{},days:{},pron:{},listening:{}}};save();render()}}
function phrases(){app.innerHTML=panel(`${title(1,'Words & Phrases','Выбери правильный перевод')}
<div class="selectrow" style="margin-top:8px;flex:1;align-content:start">${data.phrases.map((p,i)=>{const done=state.answers.phrases[i]!==undefined;return `<div class="task phrase-card ${done?(state.answers.phrases[i]?'correct':'wrong'):''}"><div class="phrase">${esc(p[0])}</div><select class="phrase-select" data-p="${i}" ${done?'disabled':''}><option value="">Выбери перевод</option>${data.phrases.map(x=>`<option value="${esc(x[1])}">${esc(x[1])}</option>`).join('')}</select>${done?`<div class="feedback ${state.answers.phrases[i]?'good':'bad'}">${state.answers.phrases[i]?'Верно':'Ошибка'}</div>`:''}</div>`}).join('')}</div>
<div class="footeractions"><div class="leftactions">${audioCtl('phrases','Послушать фразы','stp')}</div>${nav(2)}</div>`);document.querySelectorAll('[data-p]').forEach(s=>s.onchange=()=>{const i=+s.dataset.p;if(!s.value)return;state.answers.phrases[i]=s.value===data.phrases[i][1];save();render()});document.getElementById('next').onclick=()=>setScreen(2);bindAudio()}
function grammar(){app.innerHTML=panel(`${title(2,'Grammar Check','verb be · только I / you')}${taskGrid('grammar',data.grammar)}<div class="footeractions"><span class="smallnote">I am · You are · I’m not · You aren’t · Am I? · Are you?</span>${nav(3)}</div>`);bindChoices('grammar',data.grammar);document.getElementById('next').onclick=()=>setScreen(3)}
function numbers(){app.innerHTML=panel(`${title(3,'Numbers 0–10','Узнай число и продолжи последовательность')}${taskGrid('numbers',data.numbers)}<div class="footeractions"><div class="leftactions">${audioCtl('numbers','Послушать числа','stn')}</div>${nav(4)}</div>`);bindChoices('numbers',data.numbers);document.getElementById('next').onclick=()=>setScreen(4);bindAudio()}
function days(){app.innerHTML=panel(`${title(4,'Days & Goodbye','Дни недели и фразы прощания')}${taskGrid('days',data.days)}<div class="footeractions"><div class="leftactions">${audioCtl('days','Послушать дни','std')}</div>${nav(5)}</div>`);bindChoices('days',data.days);document.getElementById('next').onclick=()=>setScreen(5);bindAudio()}
function pron(){const bins=['/h/','/aɪ/','/iː/'];app.innerHTML=panel(`${title(5,'Sound Sort','Распредели слова по звукам')}<div class="sortarea">${bins.map(b=>`<div class="bin" data-bin="${b}"><strong>${b}</strong><div class="binwords">${data.pron.map((x,i)=>state.answers.pron[i]!==undefined&&x.a===b?`<button class="word ${state.answers.pron[i]?'good':'bad'}" disabled>${esc(x.w)}</button>`:'').join('')}</div></div>`).join('')}</div><div class="wordbank">${data.pron.map((x,i)=>state.answers.pron[i]===undefined?`<button class="word" data-word="${i}">${esc(x.w)}</button>`:'').join('')}</div><div class="footeractions"><div class="leftactions">${audioCtl('pron','Послушать образцы','stpr')}<span class="audioStatus" id="sortHint">Сначала выбери слово, затем звук</span></div>${nav(6)}</div>`);let sel=null;document.querySelectorAll('[data-word]').forEach(w=>w.onclick=()=>{document.querySelectorAll('[data-word]').forEach(x=>x.classList.remove('sel'));w.classList.add('sel');sel=+w.dataset.word});document.querySelectorAll('[data-bin]').forEach(b=>b.onclick=()=>{if(sel===null)return;state.answers.pron[sel]=data.pron[sel].a===b.dataset.bin;save();render()});document.getElementById('next').onclick=()=>setScreen(6);bindAudio()}
function listening(){app.innerHTML=panel(`${title(6,'Listening Mission','Слушай и выбирай ответ · только Lesson 1A')}${taskGrid('listening',data.listening)}<div class="footeractions"><div class="leftactions">${audioCtl('listen1','Диалог 1','stl1')}${audioCtl('listen2','Диалог 2','stl2')}</div>${nav(7,'Результат →')}</div>`);bindChoices('listening',data.listening);document.getElementById('next').onclick=()=>setScreen(7);bindAudio()}
function results(){const keys=['phrases','grammar','numbers','days','pron','listening'],labels={phrases:'Words & Phrases',grammar:'Grammar',numbers:'Numbers',days:'Days & Goodbye',pron:'Pronunciation',listening:'Listening'};const total=totalScore(),max=totalMax(),pct=Math.round(total/max*100),sorted=[...keys].sort((a,b)=>score(b)/MAX[b]-score(a)/MAX[a]),best=sorted[0],weak=sorted.at(-1);app.innerHTML=panel(`<div class="titlebar"><div class="titlewrap"><h1>Your <span class="n">Results</span></h1><p>Итоги проверочной работы по Lesson 1A</p></div><div class="progress"><strong>Готово</strong><div class="track"><i style="width:100%"></i></div></div></div><div class="results"><div class="ring" style="--pct:${pct}"><strong>${pct}%</strong><span>общий результат</span></div><div><div class="resultlist">${keys.map(k=>{const p=Math.round(score(k)/MAX[k]*100);return `<div class="resrow"><label>${labels[k]}</label><div class="resbar"><i style="width:${p}%"></i></div><b>${score(k)}/${MAX[k]}</b></div>`}).join('')}</div><div class="coach"><div><strong>Сильная сторона</strong><p>${labels[best]} — лучший результат в этой попытке.</p></div><div><strong>Что повторить</strong><p>${labels[weak]} — сюда стоит вернуться ещё раз.</p></div></div><div class="heroBtns"><button class="btn primary" id="retry">Пройти ещё раз</button><button class="btn secondary" id="home">На главную</button></div></div></div>`);document.getElementById('retry').onclick=()=>{state.answers={phrases:{},grammar:{},numbers:{},days:{},pron:{},listening:{}};setScreen(1)};document.getElementById('home').onclick=()=>setScreen(0)}
function render(){[start,phrases,grammar,numbers,days,pron,listening,results][state.screen||0]()}
render();
</script>
