<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>WOW SCHOOL · English File Beginner · 1A Review</title>
  <style>
:root{
  --ink:#10214a;
  --ink-2:#182e66;
  --muted:#64749a;
  --white:#fff;
  --blue:#2e8cff;
  --blue2:#56b5ff;
  --violet:#8b5cf6;
  --mint:#21c9c3;
  --pink:#ff5f8f;
  --yellow:#ffbf3f;
  --green:#25c77a;
  --red:#ef5f72;
  --panel:rgba(255,255,255,.90);
  --panel-2:rgba(255,255,255,.74);
  --shadow:0 28px 70px rgba(20,55,120,.20);
  --shadow-soft:0 16px 34px rgba(35,75,145,.15);
  --radius:28px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfeeff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}
button,input{font:inherit}
button{border:0}
.app-shell{
  position:relative;
  width:100vw;
  height:100vh;
  min-width:720px;
  min-height:405px;
  overflow:hidden;
  isolation:isolate;
  background:
    linear-gradient(135deg,#eaf6ff 0%,#f7efff 48%,#fff5df 100%);
}
.bg-layer{position:absolute;inset:auto;pointer-events:none;z-index:-1;filter:blur(.2px)}
.bg-a{width:34vw;height:34vw;border-radius:50%;left:-8vw;top:-10vw;background:radial-gradient(circle at 35% 35%,rgba(56,143,255,.65),rgba(56,143,255,0) 70%)}
.bg-b{width:36vw;height:36vw;border-radius:50%;right:-10vw;top:-12vw;background:radial-gradient(circle at 50% 50%,rgba(158,106,255,.42),rgba(158,106,255,0) 70%)}
.bg-c{width:42vw;height:22vw;right:4vw;bottom:-11vw;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(255,192,76,.45),rgba(255,192,76,0) 72%)}

.topbar{
  height:11.5vh;
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1.4vh 3vw 0;
  position:relative;
  z-index:5;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{
  font-weight:1000;
  font-size:clamp(28px,2.7vw,50px);
  letter-spacing:-.06em;
  color:#fff;
  text-shadow:0 5px 16px rgba(35,87,170,.26);
  background:linear-gradient(135deg,#2767cc,#50c8ff);
  border-radius:20px;
  padding:.2em .42em .28em;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 10px 20px rgba(32,94,189,.22);
}
.brand-divider{width:2px;height:46px;background:rgba(32,70,130,.18);border-radius:2px}
.brand-copy{display:flex;flex-direction:column;line-height:1.05}
.brand-copy strong{font-size:clamp(19px,1.5vw,28px);letter-spacing:.02em}
.brand-copy span{font-size:clamp(10px,.8vw,14px);color:var(--muted);margin-top:5px}
.unit-pill{
  display:flex;align-items:center;gap:14px;
  padding:10px 14px 10px 18px;
  border-radius:999px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px);
  box-shadow:var(--shadow-soft),inset 0 1px 0 rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.85)
}
.unit-pill span{color:var(--muted);font-weight:700;font-size:clamp(11px,.85vw,14px)}
.unit-pill strong{
  color:#fff;
  background:linear-gradient(135deg,#7b59ff,#a45eff);
  padding:9px 14px;border-radius:999px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px rgba(126,77,255,.24);
  font-size:clamp(13px,1vw,16px)
}

.screen{
  height:79vh;
  padding:1.2vh 3vw 1vh;
  display:flex;
  align-items:stretch;
  justify-content:center;
}
.stage-card{
  width:min(94vw,1500px);
  height:100%;
  border-radius:34px;
  background:linear-gradient(145deg,rgba(255,255,255,.93),rgba(255,255,255,.78));
  border:1px solid rgba(255,255,255,.95);
  box-shadow:var(--shadow),inset 0 2px 0 rgba(255,255,255,.95);
  overflow:hidden;
  position:relative;
}
.stage-card::before{
  content:"";
  position:absolute;
  width:330px;height:330px;
  left:-120px;top:-130px;border-radius:50%;
  background:radial-gradient(circle,rgba(46,140,255,.17),transparent 68%);
}
.stage-card::after{
  content:"";
  position:absolute;
  width:300px;height:300px;
  right:-110px;bottom:-150px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.14),transparent 70%);
}
.inner{position:relative;z-index:2;height:100%;padding:3.2vh 3vw;display:flex;flex-direction:column}

.hero{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:2.3vw;
  height:100%;
}
.hero-copy{display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:clamp(13px,1.15vw,20px);font-weight:850;color:var(--blue);text-transform:uppercase;letter-spacing:.12em}
h1,h2,p{margin:0}
.hero h1{
  margin-top:.5vh;
  font-size:clamp(48px,6vw,104px);
  line-height:.92;
  letter-spacing:-.065em;
  color:#0e1c61;
}
.hero h1 span{display:block;color:var(--blue)}
.hero-sub{
  margin-top:1.6vh;
  font-size:clamp(16px,1.55vw,26px);
  color:#44567d;
  font-weight:650;
  max-width:760px;
  line-height:1.35;
}
.hero-actions{margin-top:2.2vh;display:flex;gap:14px;align-items:center}
.btn{
  border-radius:18px;
  padding:14px 22px;
  font-weight:900;
  cursor:pointer;
  transition:.18s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 22px rgba(37,87,160,.18);
}
.btn:hover{transform:translateY(-2px)}
.btn-primary{color:#fff;background:linear-gradient(135deg,#1fc9c1,#1899e8)}
.btn-secondary{color:var(--ink);background:rgba(255,255,255,.84);border:1px solid rgba(54,94,161,.13)}
.hero-visual{
  display:flex;align-items:center;justify-content:center;position:relative
}
.orb{
  width:min(31vw,430px);aspect-ratio:1;
  border-radius:42% 58% 52% 48% / 48% 43% 57% 52%;
  background:
    radial-gradient(circle at 35% 28%,#fff 0 8%,transparent 9%),
    linear-gradient(145deg,#47c9ff 0%,#7f65ff 48%,#ff73b1 100%);
  box-shadow:inset 12px 14px 32px rgba(255,255,255,.32),inset -20px -22px 34px rgba(41,41,123,.18),0 34px 55px rgba(61,90,180,.26);
  position:relative;
  animation:float 4s ease-in-out infinite
}
@keyframes float{50%{transform:translateY(-7px) rotate(1deg)}}
.cup{
  position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
  width:56%;height:38%;
  background:linear-gradient(145deg,#fff,#dfe9f4);
  border-radius:22px 22px 50% 50%;
  box-shadow:inset 10px 10px 18px rgba(255,255,255,.9),inset -10px -10px 20px rgba(113,133,165,.18),0 24px 30px rgba(32,54,97,.24)
}
.cup::before{
  content:"";position:absolute;left:11%;right:11%;top:8%;height:26%;border-radius:50%;
  background:radial-gradient(ellipse at center,#d39963 0 33%,#7e4d2c 34% 59%,#2f1d14 60% 100%);
  box-shadow:inset 0 4px 5px rgba(255,255,255,.17)
}
.cup::after{
  content:"";position:absolute;right:-20%;top:22%;width:29%;height:47%;border:12px solid #e8eef5;border-left:0;border-radius:0 28px 28px 0
}
.saucer{
  position:absolute;left:50%;top:67%;transform:translateX(-50%);
  width:67%;height:13%;border-radius:50%;
  background:linear-gradient(180deg,#fff,#dce6f0);
  box-shadow:0 18px 22px rgba(31,60,106,.16)
}
.mini-tag{
  position:absolute;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.88);
  box-shadow:var(--shadow-soft);font-weight:900;color:var(--ink)
}
.tag-a{left:-6%;top:13%;transform:rotate(-7deg)}
.tag-b{right:-3%;bottom:11%;transform:rotate(7deg)}

.headline-row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.section-title{font-size:clamp(30px,3.2vw,56px);letter-spacing:-.045em;line-height:1;color:#0f1f61}
.section-title span{color:var(--blue)}
.section-sub{margin-top:8px;color:var(--muted);font-size:clamp(13px,1.1vw,18px);font-weight:650}
.progress-chip{
  min-width:160px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.78);
  box-shadow:var(--shadow-soft);border:1px solid rgba(69,97,155,.10)
}
.progress-chip strong{display:block;font-size:14px}
.progress-track{height:10px;background:#e6edf8;border-radius:99px;margin-top:8px;overflow:hidden}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:99px}

.task-grid{display:grid;gap:14px;margin-top:2vh;flex:1;min-height:0}
.two-col{grid-template-columns:1fr 1fr}
.three-col{grid-template-columns:repeat(3,1fr)}
.task-card{
  background:rgba(255,255,255,.86);
  border:1px solid rgba(74,106,164,.10);
  border-radius:22px;
  padding:16px;
  box-shadow:0 10px 24px rgba(47,75,128,.10),inset 0 1px 0 rgba(255,255,255,.8);
  display:flex;flex-direction:column;justify-content:center;min-height:0;
}
.task-card h3{font-size:clamp(15px,1.25vw,20px);margin:0 0 8px;color:var(--ink)}
.prompt{font-weight:780;color:#30426d;font-size:clamp(13px,1.1vw,18px)}
.options{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.option{
  background:#f4f7ff;border:1px solid #dce6f7;color:#24375f;border-radius:14px;
  padding:9px 12px;font-weight:800;cursor:pointer;transition:.15s ease
}
.option:hover{transform:translateY(-1px);background:#eef5ff}
.option.selected{background:#e8f4ff;border-color:#58a8ff;color:#1266bf}
.option.correct{background:#e6faef;border-color:#47ce88;color:#16874b}
.option.wrong{background:#fff0f2;border-color:#f48594;color:#ba4251}
.text-answer{
  width:100%;border:1px solid #dce6f5;border-radius:14px;background:#f8fbff;
  padding:10px 12px;color:var(--ink);font-weight:800;outline:none
}
.text-answer:focus{border-color:#59a9ff;box-shadow:0 0 0 3px rgba(46,140,255,.12)}
.audio-btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:10px 13px;
  background:linear-gradient(135deg,#31c6c1,#278df4);color:white;font-weight:900;cursor:pointer;
  box-shadow:0 8px 18px rgba(32,144,204,.18)
}
.audio-btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.audio-status{font-size:12px;color:var(--muted);margin-top:7px;font-weight:700}
.sort-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.sound-bin{
  min-height:110px;border-radius:18px;padding:12px;background:linear-gradient(180deg,#f8fbff,#eef5ff);
  border:1px dashed #a9c4eb
}
.sound-bin strong{display:block;font-size:21px;margin-bottom:8px}
.word-bank{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.word-chip{padding:8px 11px;border-radius:12px;background:white;border:1px solid #dfe7f5;font-weight:850;cursor:pointer}
.feedback-line{min-height:26px;margin-top:8px;font-size:13px;font-weight:850}
.good{color:#19894d}.bad{color:#c1485b}
.bottom-actions{display:flex;align-items:center;justify-content:space-between;margin-top:1.4vh;gap:12px}
.score-mini{font-size:13px;color:var(--muted);font-weight:800}
.result-layout{display:grid;grid-template-columns:.78fr 1.22fr;gap:2vw;flex:1;align-items:center}
.score-orb{
  width:min(26vw,360px);aspect-ratio:1;border-radius:50%;margin:auto;
  display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--green) var(--p,0%),#e9eef8 0);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 24px 44px rgba(37,103,151,.17)
}
.score-orb::after{content:"";position:absolute;width:78%;height:78%;border-radius:50%;background:linear-gradient(145deg,#fff,#f5f9ff);box-shadow:inset 0 4px 14px rgba(73,103,150,.08)}
.score-orb strong{position:relative;z-index:2;font-size:clamp(48px,6vw,90px);letter-spacing:-.06em}
.score-orb span{position:absolute;z-index:2;margin-top:90px;font-weight:800;color:var(--muted)}
.result-bars{display:grid;gap:10px}
.result-row{display:grid;grid-template-columns:170px 1fr 58px;gap:12px;align-items:center}
.result-row label{font-weight:850}
.result-row .bar{height:12px;border-radius:99px;background:#e8eef8;overflow:hidden}
.result-row .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2eb5ff,#7a5bff)}
.result-row b{text-align:right}
.coach-box{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.coach-card{padding:14px;border-radius:18px;background:rgba(255,255,255,.78);border:1px solid rgba(75,103,164,.1)}
.coach-card strong{display:block;margin-bottom:6px}
.coach-card p{font-size:13px;color:var(--muted);font-weight:700;line-height:1.35}

.footerbar{
  height:9.5vh;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 3vw 1.2vh;
}
.step-dots{display:flex;gap:8px}
.step-dot{width:10px;height:10px;border-radius:50%;background:#cbd7ea;transition:.2s}
.step-dot.active{width:28px;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--blue))}
.step-dot.done{background:#7fd9b2}
.footer-note{color:#7886a4;font-size:12px;font-weight:800}

@media (max-aspect-ratio: 4/3){
  .app-shell{min-width:0}
  .hero{grid-template-columns:1fr .8fr}
  .hero h1{font-size:clamp(38px,5.6vw,76px)}
  .stage-card{width:95vw}
}
@media (max-height:650px){
  .inner{padding:2vh 2.5vw}
  .task-grid{gap:9px;margin-top:1.2vh}
  .task-card{padding:12px;border-radius:18px}
  .section-title{font-size:clamp(26px,2.7vw,44px)}
  .hero-sub{margin-top:1vh}
}
</style>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <div class="bg-layer bg-a"></div>
    <div class="bg-layer bg-b"></div>
    <div class="bg-layer bg-c"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">WOW</div>
        <div class="brand-divider"></div>
        <div class="brand-copy">
          <strong>SCHOOL</strong>
          <span>More English · Brighter Futures</span>
        </div>
      </div>
      <div class="unit-pill">
        <span>English File Beginner</span>
        <strong>Unit 1A</strong>
      </div>
    </header>

    <section id="screen" class="screen"></section>

    <footer class="footerbar">
      <div id="stepDots" class="step-dots" aria-label="Прогресс"></div>
      <div class="footer-note">WOW SCHOOL · Unit Review</div>
    </footer>
  </main>

  <script>
const AUDIO = {
  phrases_1: "assets/audio/phrases_1.mp3",
  numbers_1: "assets/audio/numbers_1.mp3",
  days_1: "assets/audio/days_1.mp3",
  listening_1: "assets/audio/listening_1.mp3",
  listening_2: "assets/audio/listening_2.mp3",
  pronunciation_1: "assets/audio/pronunciation_1.mp3"
};

const state = {
  screen: 0,
  scores: {
    phrases: 0,
    grammar: 0,
    numbers: 0,
    days: 0,
    pronunciation: 0,
    listening: 0
  },
  max: {
    phrases: 8,
    grammar: 10,
    numbers: 8,
    days: 8,
    pronunciation: 8,
    listening: 8
  }
};

const screens = [
  "start",
  "phrases",
  "grammar",
  "numbers",
  "days",
  "pronunciation",
  "listening",
  "results"
];

const data = {
  phrases: [
    ["Hi","Привет"],
    ["Hello","Здравствуйте / Привет"],
    ["What’s your name?","Как тебя / вас зовут?"],
    ["Nice to meet you","Приятно познакомиться"],
    ["A cappuccino, please","Капучино, пожалуйста"],
    ["A tea, please","Чай, пожалуйста"],
    ["Thanks","Спасибо"],
    ["Sorry","Извините / Простите"]
  ],
  grammar: [
    {q:"I ___ Helen", opts:["am","are"], a:"am"},
    {q:"You ___ Tom", opts:["am","are"], a:"are"},
    {q:"I ___ not Ellen", opts:["am","are"], a:"am"},
    {q:"You ___ not Dom", opts:["am","are"], a:"are"},
    {q:"___ I in class 2?", opts:["Am","Are"], a:"Am"},
    {q:"___ you Mike?", opts:["Am","Are"], a:"Are"},
    {q:"Are you Helen?", opts:["Yes, I am","Yes, you are"], a:"Yes, I am"},
    {q:"Am I in your class?", opts:["Yes, you are","Yes, I am"], a:"Yes, you are"},
    {q:"Are you Diana?", opts:["No, I’m not","No, you aren’t"], a:"No, I’m not"},
    {q:"Am I in room 8?", opts:["No, you aren’t","No, I’m not"], a:"No, you aren’t"}
  ],
  numbers: [
    {q:"zero", opts:["0","2","10"], a:"0"},
    {q:"three", opts:["3","7","9"], a:"3"},
    {q:"five", opts:["4","5","6"], a:"5"},
    {q:"seven", opts:["1","7","8"], a:"7"},
    {q:"nine", opts:["6","8","9"], a:"9"},
    {q:"one, two, ___", opts:["three","five","ten"], a:"three"},
    {q:"seven, eight, ___", opts:["nine","six","zero"], a:"nine"},
    {q:"eight, nine, ___", opts:["ten","three","five"], a:"ten"}
  ],
  days: [
    {q:"Monday →", opts:["Tuesday","Friday","Sunday"], a:"Tuesday"},
    {q:"Tuesday →", opts:["Wednesday","Monday","Saturday"], a:"Wednesday"},
    {q:"Wednesday →", opts:["Thursday","Tuesday","Friday"], a:"Thursday"},
    {q:"Thursday →", opts:["Friday","Sunday","Monday"], a:"Friday"},
    {q:"Friday →", opts:["Saturday","Thursday","Tuesday"], a:"Saturday"},
    {q:"Saturday →", opts:["Sunday","Friday","Monday"], a:"Sunday"},
    {q:"Goodbye, Tom. See you on ___", opts:["Friday","five","tea"], a:"Friday"},
    {q:"See you ___", opts:["tomorrow","cappuccino","Helen"], a:"tomorrow"}
  ],
  pronunciation: [
    {w:"hello", a:"/h/"},
    {w:"Helen", a:"/h/"},
    {w:"hi", a:"/h/"},
    {w:"I’m", a:"/aɪ/"},
    {w:"five", a:"/aɪ/"},
    {w:"nine", a:"/aɪ/"},
    {w:"meet", a:"/iː/"},
    {w:"tea", a:"/iː/"}
  ],
  listening: [
    {q:"What does the speaker order?", opts:["A cappuccino","A tea","Two teas"], a:"A cappuccino"},
    {q:"What name do you hear?", opts:["Helen","Ellen","Diana"], a:"Helen"},
    {q:"Are you Diana?", opts:["No, I’m not","Yes, you are","No, you aren’t"], a:"No, I’m not"},
    {q:"What does Tom order?", opts:["A tea","A cappuccino","Three teas"], a:"A tea"},
    {q:"Tom or Dom?", opts:["Tom","Dom","Mike"], a:"Tom"},
    {q:"What phrase do you hear?", opts:["Nice to meet you","See you tomorrow","Good morning"], a:"Nice to meet you"},
    {q:"Which number do you hear?", opts:["three","five","nine"], a:"five"},
    {q:"Which goodbye phrase do you hear?", opts:["See you on Friday","See you on Monday","See you on Sunday"], a:"See you on Friday"}
  ]
};

const $ = s => document.querySelector(s);
const screenEl = $("#screen");
const stepDots = $("#stepDots");

function save(){
  localStorage.setItem("wow_unit1a_state_v3", JSON.stringify(state));
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem("wow_unit1a_state_v3"));
    if(s && s.scores) state.scores = {...state.scores, ...s.scores};
  }catch(e){}
}
load();

function setScreen(i){
  state.screen = Math.max(0, Math.min(i, screens.length-1));
  render();
  save();
}
function renderDots(){
  stepDots.innerHTML = screens.map((_,i)=>{
    const cls = i===state.screen ? "step-dot active" : (i<state.screen ? "step-dot done":"step-dot");
    return `<span class="${cls}"></span>`;
  }).join("");
}
function stage(content){
  return `<div class="stage-card"><div class="inner">${content}</div></div>`;
}
function progressChip(i){
  const p = Math.round((i/6)*100);
  return `<div class="progress-chip">
    <strong>Прогресс ${i}/6</strong>
    <div class="progress-track"><i style="width:${p}%"></i></div>
  </div>`;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
}
function makeOptionButtons(opts, qidx, group){
  return `<div class="options">${opts.map(o=>`<button class="option" data-group="${group}" data-q="${qidx}" data-value="${escapeHTML(o)}">${escapeHTML(o)}</button>`).join("")}</div>`;
}
function bindChoiceBlock(group, questions, scoreKey){
  const answered = new Map();
  screenEl.querySelectorAll(`.option[data-group="${group}"]`).forEach(btn=>{
    btn.addEventListener("click",()=>{
      const q = +btn.dataset.q;
      if(answered.has(q)) return;
      const correct = questions[q].a;
      const value = btn.dataset.value;
      answered.set(q, value);
      screenEl.querySelectorAll(`.option[data-group="${group}"][data-q="${q}"]`).forEach(b=>{
        if(b.dataset.value===correct) b.classList.add("correct");
        else if(b===btn) b.classList.add("wrong");
        b.disabled=true;
      });
      if(value===correct) state.scores[scoreKey] += 1;
      const fb = screenEl.querySelector(`[data-feedback="${group}-${q}"]`);
      fb.textContent = value===correct ? "Верно" : `Правильный ответ: ${correct}`;
      fb.className = `feedback-line ${value===correct?"good":"bad"}`;
      save();
    });
  });
}
async function playAudio(key, statusId){
  const status = document.getElementById(statusId);
  const src = AUDIO[key];
  const audio = new Audio(src);
  status.textContent = "Загрузка аудио…";
  try{
    await audio.play();
    status.textContent = "Воспроизведение";
    audio.addEventListener("ended",()=>status.textContent="Готово к повтору",{once:true});
  }catch(err){
    status.textContent = "MP3 пока не добавлен";
  }
}
function audioButton(key, id, label="Слушать"){
  return `<button class="audio-btn" data-audio="${key}" data-status="${id}">▶ ${label}</button>
  <div class="audio-status" id="${id}">Британское MP3-аудио</div>`;
}
function bindAudio(){
  screenEl.querySelectorAll("[data-audio]").forEach(btn=>{
    btn.addEventListener("click",()=>playAudio(btn.dataset.audio, btn.dataset.status));
  });
}

function renderPronunciation(){
  const bins=["/h/","/aɪ/","/iː/"];
  screenEl.innerHTML = stage(`
    <div class="headline-row">
      <div><h2 class="section-title"><span>5.</span> Sound Sort</h2><p class="section-sub">Распредели слова по звукам</p></div>
      ${progressChip(5)}
    </div>
    <div class="task-card" style="flex:1;margin-top:2vh">
      <div class="sort-grid">
        ${bins.map(b=>`<div class="sound-bin" data-bin="${b}"><strong>${b}</strong><div class="bin-words"></div></div>`).join("")}
      </div>
      <div class="word-bank">
        ${data.pronunciation.map((x,i)=>`<button class="word-chip" data-word="${i}">${escapeHTML(x.w)}</button>`).join("")}
      </div>
      <div class="feedback-line" id="pronFeedback"></div>
    </div>
    <div class="bottom-actions">
      <div>${audioButton("pronunciation_1","audioPron","Послушать образцы")}</div>
      <button class="btn btn-primary" id="nextBtn">Далее →</button>
    </div>
  `);
  bindAudio();
  let selected=null, done=0;
  screenEl.querySelectorAll(".word-chip").forEach(btn=>{
    btn.onclick=()=>{
      if(btn.disabled) return;
      selected=btn;
      screenEl.querySelectorAll(".word-chip").forEach(x=>x.classList.remove("selected"));
      btn.classList.add("selected");
    };
  });
  screenEl.querySelectorAll(".sound-bin").forEach(bin=>{
    bin.onclick=()=>{
      if(!selected) return;
      const i=+selected.dataset.word;
      const correct=data.pronunciation[i].a;
      const ok=bin.dataset.bin===correct;
      if(ok) state.scores.pronunciation++;
      const clone=document.createElement("span");
      clone.className="word-chip "+(ok?"correct":"wrong");
      clone.textContent=data.pronunciation[i].w;
      bin.querySelector(".bin-words").appendChild(clone);
      selected.disabled=true;selected.style.display="none";
      selected=null;done++;
      const fb=$("#pronFeedback");
      fb.textContent=ok ? "Верно" : `Слово относится к ${correct}`;
      fb.className=`feedback-line ${ok?"good":"bad"}`;
      save();
    };
  });
  $("#nextBtn").onclick = ()=>setScreen(6);
}

function renderResults(){
  const keys=["phrases","grammar","numbers","days","pronunciation","listening"];
  const labels={phrases:"Words & Phrases",grammar:"Grammar",numbers:"Numbers",days:"Days & Goodbye",pronunciation:"Pronunciation",listening:"Listening"};
  const total=keys.reduce((a,k)=>a+state.scores[k],0);
  const max=keys.reduce((a,k)=>a+state.max[k],0);
  const pct=Math.round(total/max*100);
  const strongest=[...keys].sort((a,b)=>state.scores[b]/state.max[b]-state.scores[a]/state.max[a])[0];
  const weakest=[...keys].sort((a,b)=>state.scores[a]/state.max[a]-state.scores[b]/state.max[b])[0];
  screenEl.innerHTML = stage(`
    <div class="headline-row">
      <div><h2 class="section-title">Your <span>Results</span></h2><p class="section-sub">Итоги проверочной работы по Lesson 1A</p></div>

      </div>
      <div>
        <div class="result-bars">
          ${keys.map(k=>{
            const p=Math.round(state.scores[k]/state.max[k]*100);
            return `<div class="result-row"><label>${labels[k]}</label><div class="bar"><i style="width:${p}%"></i></div><b>${state.scores[k]}/${state.max[k]}</b></div>`
          }).join("")}
        </div>
        <div class="coach-box">
          <div class="coach-card"><strong>Что получилось лучше всего</strong><p>${labels[strongest]} — самый сильный блок в этой попытке.</p></div>
          <div class="coach-card"><strong>Что повторить</strong><p>${labels[weakest]} — сюда стоит вернуться ещё раз.</p></div>
        </div>
        <div class="hero-actions" style="margin-top:16px">
          <button class="btn btn-primary" id="retryBtn">Пройти ещё раз</button>
          <button class="btn btn-secondary" id="homeBtn">На главную</button>
        </div>
      </div>
    </div>
  `);
  $("#retryBtn").onclick=()=>{Object.keys(state.scores).forEach(k=>state.scores[k]=0);setScreen(1)};
  $("#homeBtn").onclick=()=>setScreen(0);
}
